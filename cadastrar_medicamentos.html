<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Medicamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <div class="container mt-5">
    <h1 class="mb-4">Cadastrar Medicamento</h1>

    <form id="CadastrarMedicamento">
        <div class="mb-3">
            <label for="nombre" class="form-label">
                Medicamento:
            </label>
            <input
                type="text"
                class="form-control"
                id="nombre"
                name="nombre"
                required
            >

            <label for="validade" class="form-label mt-3">
                Data de Validade:
            </label>
            <input
                type="date"
                class="form-control"
                id="validade"
                name="validade"
            >
            <label for="quantidade" class="form-label mt-3">
                Quantidade:
            </label>
            <input
                type="number"
                class="form-control"
                id="quantidade"
                name="quantidade"
                required
            >
            <label for="unidades" class="form-label mt-3">
                Unidades:
            </label>
            <input
                type="text"
                class="form-control"
                id="unidades"
                name="unidades"
                required
            >
            <label for="estoque_minimo" class="form-label mt-3">
                Estoque mínimo:
            </label>
            <input
                type="number"
                class="form-control"
                id="estoque_minimo"
                name="estoque_minimo"
                required
            >
        </div>
        </div>

        <button type="submit" class="btn btn-primary">
            Cadastrar
        </button>
    </form>

    <div id="resultado" class="mt-4"></div>
    
</div>
    <script src="cadastrar_medicamento.js"></script>
</body>

</html>
